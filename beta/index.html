<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiftMetrics — Tests TestFlight</title>
<style>
:root{--bg:#0e1122;--card:#1c2040;--card2:#252a4f;--line:#363c6b;--txt:#f3f4fb;--sub:#b7bad4;--acc:#8b7cf6;--ok:#2fae5c;--ko:#e5534b;--na:#8e92b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:28px;margin:8px 0 4px} .top{display:flex;justify-content:space-between;align-items:center} .lang{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px} .lang button{background:transparent;color:var(--sub);padding:5px 12px;border-radius:999px;font-size:14px} .lang button.on{background:var(--acc);color:#fff} .lead{color:var(--sub);margin:0 0 20px}
.brand{color:var(--acc);font-weight:700;letter-spacing:.2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 16px}
h2{font-size:19px;margin:0 0 4px;color:#d9d4ff} .intro{color:var(--sub);font-style:italic;margin:0 0 10px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
input[type=text],input[type=email],textarea,select{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px}
textarea{min-height:40px;resize:vertical}
.test{border-top:1px solid var(--line);padding:12px 0}
.test:first-of-type{border-top:0}
.head{display:flex;gap:8px;align-items:baseline}
.num{color:var(--sub);font-size:13px;min-width:34px}
.name{font-weight:650}
.how,.exp{font-size:14px;color:var(--sub);margin:4px 0 0 42px}
.exp b,.how b{color:#dcdef0;font-weight:600}
.res{display:flex;gap:6px;margin:10px 0 0 42px;flex-wrap:wrap}
.res input{display:none}
.res label{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;user-select:none;background:var(--card2)}
.res input:checked+label.ok{background:var(--ok);border-color:var(--ok)}
.res input:checked+label.ko{background:var(--ko);border-color:var(--ko)}
.res input:checked+label.na{background:var(--na);border-color:var(--na)}
.rem{margin:8px 0 0 42px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(14,17,34,.96);border-top:1px solid var(--line);padding:12px 16px;backdrop-filter:blur(8px)}
.bar .in{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prog{flex:1;min-width:140px;font-size:14px;color:var(--sub)}
.meter{height:6px;background:var(--card2);border-radius:3px;margin-top:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--acc);width:0}
button{font:inherit;font-weight:650;border:0;border-radius:12px;padding:11px 16px;cursor:pointer}
.primary{background:var(--acc);color:#fff} .ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.note{font-size:13px;color:var(--sub);margin-top:10px}
.hidden{display:none}
.guide summary{cursor:pointer;list-style:none}.guide summary::-webkit-details-marker{display:none}.guide summary h2:after{content:" ▾";color:var(--sub);font-size:14px}
.guide ul{margin:8px 0 0;padding-left:20px}.guide li{margin:6px 0;color:#dcdef0;font-size:15px}.guide li b{color:#fff}.guide p{margin:8px 0 0;color:var(--sub);font-size:15px}
#done{border-color:var(--acc)}
body.locked .wrap > :not(.top):not(#gate), body.locked .bar{display:none !important}
#gate{max-width:440px;margin:40px auto}
#gate h2{font-size:24px;margin-bottom:8px}
#gate label{display:block;font-size:13px;color:var(--sub);margin:14px 0 4px}
#gate .err{color:var(--ko);font-size:14px;min-height:20px;margin-top:10px}
#gate button{width:100%;margin-top:16px}
.home{color:var(--sub);text-decoration:none;font-size:14px;margin-right:auto;margin-left:14px}
.out{background:none;border:0;color:var(--sub);font-size:13px;text-decoration:underline;padding:0;margin-left:10px;cursor:pointer}
.navtop{position:sticky;top:0;z-index:20;background:rgba(14,17,34,.96);backdrop-filter:blur(8px);margin:0 -16px 16px;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.navtop .cur{flex:1;font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;top:100%;left:8px;right:8px;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.45);max-height:70vh;overflow:auto}
.menu a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;color:var(--txt);text-decoration:none;font-size:15px}
.menu a:hover,.menu a.on{background:var(--card2)}
.menu a .cnt{color:var(--sub);font-size:13px;white-space:nowrap}
.menu a .cnt.full{color:var(--ok)}
.pager{display:flex;justify-content:space-between;gap:10px;margin:8px 0 16px}
.pager button{flex:1}
@media (max-width:600px){.grid{grid-template-columns:1fr}.how,.exp,.res,.rem{margin-left:0}h1{font-size:24px}}
</style>
</head>
<body class="locked">
<div class="wrap">
<div class="top"><span class="brand">LiftMetrics</span><a class="home" href="../" data-i="site"></a><button class="out hidden" id="logout" data-i="logout"></button><span class="lang" role="group" aria-label="Langue / Language"><button data-l="fr">FR</button><button data-l="en">EN</button></span></div>

<button class="primary" type="submit" data-i="login"></button>

<div class="page" data-page="0">
<details class="card guide" open>
<summary><h2 data-i="gT" style="display:inline"></h2></summary>
<div data-i="gB"></div>
</details>

<div class="card">
<h2 data-i="phone"></h2>
<div class="grid">
<div><label class="f" for="i_name" data-i="name"></label><input type="text" id="i_name" data-k="name"></div>
<div><label class="f" for="i_mail" data-i="mail"></label><input type="email" id="i_mail" data-k="mail"></div>
<div><label class="f" for="i_model" data-i="model"></label><input type="text" id="i_model" data-k="model" placeholder="iPhone 15 Pro"></div>
<div><label class="f" for="i_ios" data-i="ios"></label><input type="text" id="i_ios" data-k="ios" placeholder="18.6"></div>
<div><label class="f" for="i_app" data-i="app"></label><input type="text" id="i_app" data-k="app" placeholder="0.9 (42)"></div>
<div><label class="f" for="i_stick" data-i="stick"></label><select id="i_stick" data-k="stick"><option value="">—</option><option value="Oui" data-i="yes"></option><option value="Non" data-i="no"></option></select></div>
</div>
</div>

</div>

<div id="tests"></div>

<div class="page" data-page="end">
<div class="card">
<h2 data-i="general"></h2>
<textarea id="i_general" data-k="general" rows="4"></textarea>
</div>

<div class="card hidden" id="done">
<h2 data-i="doneT"></h2>
<p class="intro" style="font-style:normal" data-i="doneP"></p>
<button class="ghost" id="copy" data-i="copy"></button> <button class="ghost" id="dl" data-i="dl"></button>
<p class="note" id="copied"></p>
</div>
</div>
<div class="pager" id="pager"><button class="ghost" id="prev"></button><button class="primary" id="next"></button></div>
</div>

<div class="prog"><span id="ptxt"></span><div class="meter"><i id="pbar"></i></div></div>

</div></div>

opy the report and paste it into an e-mail to <b>liftmetrics@icloud.com</b>.", "copy": "Copy the report", "dl": "Download the report", "copied": "Report copied: paste it into an e-mail to liftmetrics@icloud.com.", "copyFail": "Couldn't copy: use “Download the report”.", "prog": "{a} test{s} of {t}", "rTitle": "LiftMetrics — TestFlight test results", "rTester": "Tester", "rDone": "Tests done: {a} of {t}", "rGeneral": "GENERAL COMMENTS", "subj": "LiftMetrics TestFlight tests", "tester": "tester", "result": "Result", "gT": "Before you start", "gB": "<p>LiftMetrics analyses your lifts from a side-view video: bar path, velocity, phases, a score out of 100 and tips. This questionnaire takes about <b>1 hour</b>, spread over 2 or 3 training sessions: no need to do it all at once.</p><ul><li><b>Safety first:</b> test with loads you control. Never change the way you lift for the app.</li><li><b>Phone placement:</b> on a tripod, at bar height, 3–4 m away, side-on (perpendicular to the bar). Keep the athlete and the plate fully in frame from start to finish.</li><li><b>The plate facing the camera</b> must be clearly visible: not hidden by a rack, a leg or another bar. Avoid backlight.</li><li><b>Voice:</b> say “Go” and “Down” clearly, no more than 3–4 m from the phone.</li><li><b>Before the session:</b> charged battery and a few GB of free space (videos are large).</li><li><b>A problem?</b> Choose “Problem” and note what you were doing just before. To attach a screenshot: take it, then share it with TestFlight.</li><li><b>Test version:</b> bugs can happen. Keep a copy of your important videos.</li><li><b>Privacy:</b> your videos stay on your iPhone. The report you send only contains what you write here.</li></ul>"}};

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const qp = new URLSearchParams(location.search).get("lang");
let lang = qp === "en" || qp === "fr" ? qp : (st.lang || ((navigator.language || "fr").toLowerCase().startsWith("fr") ? "fr" : "en"));
Object.assign(UI.fr, {site: "← Site LiftMetrics", gateT: "Espace testeurs", gateP: "Connecte-toi avec ton e-mail et le mot de passe reçu avec ton invitation TestFlight.", pw: "Mot de passe", login: "Se connecter", logout: "Se déconnecter", badPw: "Mot de passe incorrect. Vérifie celui reçu avec ton invitation.", badMail: "Indique ton adresse e-mail."});
Object.assign(UI.en, {site: "← LiftMetrics website", gateT: "Testers' area", gateP: "Sign in with your e-mail and the password you received with your TestFlight invitation.", pw: "Password", login: "Sign in", logout: "Sign out", badPw: "Wrong password. Check the one sent with your invitation.", badMail: "Enter your e-mail address."});
Object.assign(UI.fr, {menu: "Sections", home: "Avant de commencer", finish: "Remarques et envoi", prev: "← Précédent", next: "Suivant →"});
Object.assign(UI.en, {menu: "Sections", home: "Before you start", finish: "Comments and sending", prev: "← Previous", next: "Next →"});
const T = k => UI[lang][k];
// section du capteur M5Stick (masquée si le testeur n'en a pas)
const STICK = DATA.fr.findIndex(s => s.title.includes("M5Stick"));
let page = "0";
// valeurs enregistrées en français (Oui / Non, OK / Problème / Pas testé), affichées dans la langue choisie
const RES = [["OK","ok"],["Problème","ko"],["Pas testé","na"]];

function render() {
  document.documentElement.lang = lang;
  document.title = "LiftMetrics — " + T("title");
  document.querySelectorAll("[data-i]").forEach(el => { el.innerHTML = T(el.dataset.i); });
  document.getElementById("i_general").placeholder = T("generalPh");
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  const box = document.getElementById("tests");
  const pg = document.getElementById("pager");
  if (pg) document.querySelector(".wrap").appendChild(pg);
  box.innerHTML = "";
  DATA[lang].forEach((s, si) => {
    const c = document.createElement("div");
    c.className = "card page"; c.dataset.sec = si + 1; c.dataset.page = String(si + 1);
    let h = `<h2>${esc(s.title)}</h2>` + (s.intro ? `<p class="intro">${esc(s.intro)}</p>` : "");
    s.rows.forEach((r, ri) => {
      const id = `${si + 1}.${ri + 1}`;
      h += `<div class="test"><div class="head"><span class="num">${id}</span><span class="name">${esc(r.t)}</span></div>
        <div class="how"><b>${T("how")}</b> ${esc(r.how)}</div>
        <div class="exp"><b>${T("exp")}</b> ${esc(r.exp)}</div>
        <div class="res" role="radiogroup" aria-label="${T("result")} ${id}">
          ${RES.map(([v,cl]) => `<input type="radio" name="r${id}" id="r${id}_${cl}" value="${v}"${st["r" + id] === v ? " checked" : ""}><label class="${cl}" for="r${id}_${cl}">${T(cl)}</label>`).join("")}
        </div>
        <div class="rem"><textarea rows="1" data-k="m${id}" placeholder="${T("rem")}"></textarea></div></div>`;
    });
    c.innerHTML = h;
    box.appendChild(c);
  });
  bind();
  update();
  show(page);
}

// pages : "0" (avant de commencer), "1"…"n" (sections), "end" (remarques et envoi)
function pages() {
  const p = ["0"];
  DATA.fr.forEach((s, si) => { if (!(noStick() && si === STICK)) p.push(String(si + 1)); });
  p.push("end");
  return p;
}
function pageTitle(p) { return p === "0" ? T("home") : p === "end" ? T("finish") : DATA[lang][+p - 1].title; }
function secCount(si) {
  let a = 0; DATA.fr[si].rows.forEach((r, ri) => { if (st[`r${si + 1}.${ri + 1}`]) a++; });
  return [a, DATA.fr[si].rows.length];
}
function buildMenu() {
  const m = document.getElementById("menu");
  m.innerHTML = pages().map(p => {
    let cnt = "";
    if (p !== "0" && p !== "end") { const [a, n] = secCount(+p - 1); cnt = `<span class="cnt${a === n ? " full" : ""}">${a === n ? "✓ " : ""}${a}/${n}</span>`; }
    return `<a href="#${p === "0" ? "start" : p === "end" ? "send" : "s" + p}" data-p="${p}" class="${p === page ? "on" : ""}"><span>${esc(pageTitle(p))}</span>${cnt}</a>`;
  }).join("");
}
function show(p) {
  if (!pages().includes(p)) p = "0";
  page = p;
  document.querySelectorAll(".page").forEach(el => el.classList.toggle("hidden", el.dataset.page !== p));
  document.getElementById("cur").textContent = pageTitle(p);
  const ps = pages(), i = ps.indexOf(p);
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  prev.textContent = T("prev"); next.textContent = T("next");
  prev.style.visibility = i > 0 ? "visible" : "hidden";
  next.style.visibility = i < ps.length - 1 ? "visible" : "hidden";
  // boutons sous la page affichée
  const host = document.querySelector(`.page[data-page="${p}"]`);
  if (host) host.appendChild(document.getElementById("pager"));
  buildMenu();
}
function go(p) {
  const h = p === "0" ? "#start" : p === "end" ? "#send" : "#s" + p;
  if (location.hash !== h) location.hash = h; else show(p);
  window.scrollTo({top: 0});
}
function fromHash() {
  const h = location.hash.slice(1);
  if (h === "send") return "end";
  if (h.startsWith("s") && /^s\d+$/.test(h)) return h.slice(1);
  return "0";
}
window.addEventListener("hashchange", () => { show(fromHash()); window.scrollTo({top: 0}); });
document.getElementById("prev").addEventListener("click", () => { const ps = pages(); go(ps[Math.max(0, ps.indexOf(page) - 1)]); });
document.getElementById("next").addEventListener("click", () => { const ps = pages(); go(ps[Math.min(ps.length - 1, ps.indexOf(page) + 1)]); });
document.getElementById("mbtn").addEventListener("click", e => {
  const m = document.getElementById("menu"), open = m.classList.toggle("hidden") === false;
  e.currentTarget.setAttribute("aria-expanded", open);
});
document.getElementById("menu").addEventListener("click", () => {
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("mbtn").setAttribute("aria-expanded", "false");
});
document.addEventListener("click", e => {
  if (!e.target.closest(".navtop")) { document.getElementById("menu").classList.add("hidden"); document.getElementById("mbtn").setAttribute("aria-expanded", "false"); }
});

function bind() {
  document.querySelectorAll("[data-k]").forEach(el => {
    if (el.dataset.bound) return;
    el.dataset.bound = "1";
    if (st[el.dataset.k] != null) el.value = st[el.dataset.k];
    el.addEventListener("input", () => { st[el.dataset.k] = el.value; save(); update(); });
    el.addEventListener("change", () => { st[el.dataset.k] = el.value; save(); update(); });
  });
  document.querySelectorAll(".res input").forEach(el => {
    el.addEventListener("change", () => { st[el.name] = el.value; save(); update(); });
  });
}

const noStick = () => (st.stick || "") === "Non";
function total() { return DATA.fr.reduce((n, s, si) => n + (noStick() && si === STICK ? 0 : s.rows.length), 0); }
function answered() {
  let n = 0;
  DATA.fr.forEach((s, si) => { if (noStick() && si === STICK) return; s.rows.forEach((r, ri) => { if (st[`r${si + 1}.${ri + 1}`]) n++; }); });
  return n;
}
function update() {
  if (document.getElementById("menu")) buildMenu();
  const t = total(), a = answered();
  document.getElementById("ptxt").textContent = T("prog").replace("{a}", a).replace("{t}", t).replace("{s}", a > 1 ? "s" : "");
  document.getElementById("pbar").style.width = (t ? a / t * 100 : 0) + "%";
}

function label(v) { const r = RES.find(x => x[0] === v); return r ? T(r[1]) : v; }
function report() {
  const L = [];
  const stick = st.stick === "Oui" ? T("yes") : st.stick === "Non" ? T("no") : "—";
  L.push(T("rTitle") + " (" + lang.toUpperCase() + ")");
  L.push(`${T("rTester")} : ${st.name || "—"}${st.mail ? " <" + st.mail + ">" : ""}`);
  L.push(`iPhone : ${st.model || "—"} · iOS ${st.ios || "—"} · LiftMetrics ${st.app || "—"} · M5Stick : ${stick}`);
  L.push(T("rDone").replace("{a}", answered()).replace("{t}", total()));
  L.push("");
  DATA[lang].forEach((s, si) => {
    if (noStick() && si === STICK) return;
    const lines = [];
    s.rows.forEach((r, ri) => {
      const id = `${si + 1}.${ri + 1}`, v = st["r" + id], m = (st["m" + id] || "").trim();
      if (!v && !m) return;
      lines.push(`${id} ${r.t} : ${v ? label(v) : "—"}${m ? " — " + m : ""}`);
    });
    if (lines.length) { L.push(s.title.toUpperCase()); L.push(...lines); L.push(""); }
  });
  if ((st.general || "").trim()) { L.push(T("rGeneral")); L.push(st.general.trim()); }
  return L.join("\n");
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.l; st.lang = lang; save(); render();
}));
document.getElementById("send").addEventListener("click", () => {
  const subj = `${T("subj")} — ${st.name || T("tester")} — ${st.model || "iPhone"}`;
  go("end");
  document.getElementById("done").classList.remove("hidden");
  window.location.href = "mailto:liftmetrics@icloud.com?subject=" + encodeURIComponent(subj) + "&body=" + encodeURIComponent(report());
  setTimeout(() => document.getElementById("done").scrollIntoView({behavior: "smooth"}), 400);
});
document.getElementById("copy").addEventListener("click", async () => {
  const msg = document.getElementById("copied");
  try { await navigator.clipboard.writeText(report()); msg.textContent = T("copied"); }
  catch (e) { msg.textContent = T("copyFail"); }
});
document.getElementById("dl").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([report()], {type: "text/plain;charset=utf-8"}));
  a.download = "LiftMetrics_tests_" + (st.name || T("tester")).replace(/\s+/g, "_") + ".txt";
  a.click();
});
// Espace testeurs : e-mail + mot de passe commun (empreinte SHA-256, rien n'est envoyé).
const GATE = "082a30656c05c97bdaacb9dfea7469907ba877fa5b64e1c395737e3221c1efeb";
const AUTH = "lm_tester";
async function sha(t) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
function unlock(mail) {
  document.body.classList.remove("locked");
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("logout").classList.remove("hidden");
  if (mail && !st.mail) { st.mail = mail; save(); const f = document.getElementById("i_mail"); if (f) f.value = mail; }
}
let auth = null;
try { auth = JSON.parse(localStorage.getItem(AUTH) || "null"); } catch (e) {}
if (auth && auth.h === GATE) unlock(auth.mail);
document.getElementById("gate").addEventListener("submit", async e => {
  e.preventDefault();
  const mail = document.getElementById("g_mail").value.trim(), pw = document.getElementById("g_pw").value;
  const err = document.getElementById("g_err");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) { err.textContent = T("badMail"); return; }
  const h = await sha("liftmetrics-testers:" + pw);
  if (h !== GATE) { err.textContent = T("badPw"); return; }
  err.textContent = "";
  try { localStorage.setItem(AUTH, JSON.stringify({mail, h})); } catch (e) {}
  unlock(mail);
});
["g_mail", "g_pw"].forEach(id => document.getElementById(id).addEventListener("input", () => { document.getElementById("g_err").textContent = ""; }));
document.getElementById("logout").addEventListener("click", () => {
  try { localStorage.removeItem(AUTH); } catch (e) {}
  location.reload();
});
page = fromHash();
render();
</script>
</body>
</html>
